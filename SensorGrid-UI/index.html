<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensorGrid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>SensorGrid Monitoring</h1>
    </header>

    <div class="grid-container">
        <section class="dashboard">
            <h2>Dashboard</h2>
            <p>Active Sensors: 3</p>
            <p>System Status: OK</p>
        </section>

        <section class="sensors">
            <h2>Sensors</h2>
            <div class="sensor-list">
                <div class="sensor online">Sensor 1 (ONLINE)</div>
                <div class="sensor offline">Sensor 2 (OFFLINE)</div>
                <div class="sensor alert">Sensor 3 (ALERT)</div>
            </div>
        </section>

        <section class="analytics">
            <h2>Analytics</h2>
            <p>Average Temperature: 24°C</p>
        </section>

        <section class="alerts">
            <h2>Alerts</h2>
            <ul>
                <li>Warning: Sensor 3 high temp!</li>
            </ul>
        </section>
    </div>
</body>
</html>
